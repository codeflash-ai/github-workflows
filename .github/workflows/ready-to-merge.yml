name: Ready to Merge

on:
  workflow_call:
    inputs:
      result:
        description: "Pass 'success' when all upstream jobs passed"
        type: string
        required: false
        default: "success"

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ inputs.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
